name: Cleanup Intelligence Fragments

on:
  push:
    branches: [main]
    paths: [.github/workflows/cleanup-intelligence-fragments.yml]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_REGION: eu-north-1
      APP_INSTANCE_TAG: vorinthex-early-app
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/load-environments-json
        with:
          git-crypt-key-b64: ${{ secrets.GIT_CRYPT_KEY }}

      - name: Load infrastructure role
        run: echo "AWS_INFRA_ROLE_ARN=$(jq -r '.vars.AWS_INFRA_ROLE_ARN' .github/environments.json)" >> "$GITHUB_ENV"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_INFRA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Snapshot graph database volume
        run: |
          set -euo pipefail
          VOLUME_ID=$(aws ec2 describe-volumes \
            --filters "Name=tag:Name,Values=vorinthex-prod-graph-db-data" \
            --query 'Volumes[0].VolumeId' --output text)
          test -n "$VOLUME_ID" && test "$VOLUME_ID" != "None"
          SNAPSHOT_ID=$(aws ec2 create-snapshot \
            --volume-id "$VOLUME_ID" \
            --description "Pre-intelligenceFragments-cleanup ${GITHUB_SHA}" \
            --tag-specifications 'ResourceType=snapshot,Tags=[{Key=Name,Value=vorinthex-pre-fragment-cleanup}]' \
            --query SnapshotId --output text)
          echo "Created snapshot $SNAPSHOT_ID for $VOLUME_ID"
          aws ec2 wait snapshot-completed --snapshot-ids "$SNAPSHOT_ID"
          STATE=$(aws ec2 describe-snapshots --snapshot-ids "$SNAPSHOT_ID" --query 'Snapshots[0].State' --output text)
          test "$STATE" = "completed"
          echo "Snapshot $SNAPSHOT_ID is completed"

      - name: Truncate and verify fragment ledger
        run: |
          set -euo pipefail
          IID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${APP_INSTANCE_TAG}" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          test -n "$IID" && test "$IID" != "None"

          SCRIPT=$(cat <<'SCRIPT_EOF'
          set -euo pipefail
          source /opt/vorinthex/overrides.env
          ARANGO_DATABASE=$(aws ssm get-parameter --region eu-north-1 --name /vorinthex/prod/ARANGO_DATABASE --query Parameter.Value --output text)
          ARANGO_ROOT_PASSWORD=$(aws ssm get-parameter --region eu-north-1 --name /vorinthex/prod/ARANGO_ROOT_PASSWORD --with-decryption --query Parameter.Value --output text)
          ARANGO_URL="http://${DB_PRIVATE_IP}:8529"

          query() {
            local aql="$1"
            jq -nc --arg query "$aql" '{query:$query}' | curl -fsS --user "root:${ARANGO_ROOT_PASSWORD}" --header 'Content-Type: application/json' --data-binary @- "${ARANGO_URL}/_db/${ARANGO_DATABASE}/_api/cursor"
          }

          BEFORE=$(query 'RETURN { entries: LENGTH(intelligenceFragments), value: SUM(FOR fragment IN intelligenceFragments RETURN fragment.fragments) }' | jq -c '.result[0]')
          echo "Before cleanup: ${BEFORE}"

          ACTIVE_COLOR=$(cat /opt/vorinthex/active-color)
          ACTIVE_API="api-${ACTIVE_COLOR}"
          trap 'docker start "$ACTIVE_API" >/dev/null 2>&1 || true' EXIT
          docker stop "$ACTIVE_API" >/dev/null

          curl -fsS --request PUT --user "root:${ARANGO_ROOT_PASSWORD}" "${ARANGO_URL}/_db/${ARANGO_DATABASE}/_api/collection/intelligenceFragments/truncate?waitForSync=true" >/dev/null

          AFTER=$(query 'RETURN { entries: LENGTH(intelligenceFragments), value: SUM(FOR fragment IN intelligenceFragments RETURN fragment.fragments) }' | jq -c '.result[0]')
          echo "After cleanup: ${AFTER}"
          test "$(echo "$AFTER" | jq -r '.entries')" = "0"
          test "$(echo "$AFTER" | jq -r '.value')" = "0"

          INDEX_COUNT=$(curl -fsS --user "root:${ARANGO_ROOT_PASSWORD}" "${ARANGO_URL}/_db/${ARANGO_DATABASE}/_api/index?collection=intelligenceFragments" | jq '.indexes | length')
          test "$INDEX_COUNT" -ge 7
          echo "Indexes preserved: ${INDEX_COUNT}"

          docker start "$ACTIVE_API" >/dev/null
          trap - EXIT
          for attempt in $(seq 1 30); do
            if docker run --rm --network vorinthex curlimages/curl:8.10.1 -fsS "http://${ACTIVE_API}:3001/api/v1/health" >/dev/null; then
              echo "API healthy"
              exit 0
            fi
            sleep 3
          done
          echo "API health check timed out" >&2
          exit 1
          SCRIPT_EOF
          )

          SCRIPT_B64=$(printf '%s' "$SCRIPT" | base64 -w0)
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$IID" \
            --document-name AWS-RunShellScript \
            --comment "truncate intelligenceFragments ${GITHUB_SHA}" \
            --timeout-seconds 600 \
            --parameters commands="[\"echo ${SCRIPT_B64} | base64 -d > /tmp/cleanup-fragments.sh\",\"chmod 700 /tmp/cleanup-fragments.sh\",\"/tmp/cleanup-fragments.sh\",\"rm -f /tmp/cleanup-fragments.sh\"]" \
            --query 'Command.CommandId' --output text)
          echo "SSM command: $COMMAND_ID"

          for attempt in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$IID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success) break ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$IID" --query StandardErrorContent --output text || true
                exit 1
                ;;
            esac
            sleep 5
          done

          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$IID" --query StandardOutputContent --output text
          test "$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$IID" --query Status --output text)" = "Success"
