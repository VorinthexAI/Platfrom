<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vorinthex product screenshot</title>
    <link rel="stylesheet" href="./template.css">
  </head>
  <body>
    <main class="canvas" aria-label="">
      <img class="background" alt="">
      <div class="background-treatment"></div>
      <div class="ambient ambient-top"></div>
      <div class="ambient ambient-bottom"></div>

      <header class="header">
        <img class="brand-logo" alt="">
        <div class="header-rule"></div>
        <p class="title"></p>
      </header>

      <section class="device" aria-label="Product interface preview">
        <div class="device-shell">
          <div class="screen-window">
            <img class="screen" alt="">
          </div>
          <div class="fallback-frame" aria-hidden="true">
            <span class="fallback-speaker"></span>
            <span class="fallback-button fallback-button-top"></span>
            <span class="fallback-button fallback-button-bottom"></span>
          </div>
          <img class="device-frame" alt="">
        </div>
      </section>

      <footer class="footer">
        <div class="footer-rule"></div>
        <p class="description"></p>
      </footer>
    </main>
  </body>
</html>
