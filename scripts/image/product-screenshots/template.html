<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vorinthex product screenshot</title>
    <link rel="stylesheet" href="./template.css">
  </head>
  <body>
    <main class="canvas" aria-label="">
      <img class="background" alt="">
      <div class="background-treatment"></div>
      <header class="brand">
        <img class="brand-logo" alt="">
      </header>
      <section class="device" aria-label="Product interface preview">
        <div class="screen-window">
          <img class="screen" alt="">
        </div>
        <div class="phone"></div>
        <span class="speaker" aria-hidden="true"></span>
        <img class="device-frame" alt="">
      </section>
      <footer class="footer">
        <p class="description"></p>
      </footer>
    </main>
  </body>
</html>
